name: Release

# Tagging vX.Y.Z[-suffix] (on main) runs the end-to-end tests against the site, publishes the npm package @fsharp-wasm/runtime (the secret NPM_TOKEN; a tag run without it
# fails) and a GitHub release with the showcase site as a zip (landing page + prebuilt demos).  No compiler is needed: site/ holds the prebuilt demos.
# A release is made by "Run workflow" on main with the input `version` (X.Y.Z or X.Y.Z-suffix): the run does everything below and makes the tag v<version> itself, with the GitHub
# release, once the packages are pushed (a run that fails before that leaves no tag, and can be run again).  Pushing a tag v<version> on main by hand does the same.
# Run without a version it is a dry run: everything but the push, the release and the tag, and the files uploaded as an artifact.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release this version (X.Y.Z or X.Y.Z-suffix) from main, and make its tag v<version>; empty: a dry run that publishes nothing"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}   # job level, so `if: env.NODE_AUTH_TOKEN` below can see it
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: The version, and whether this is a release
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          semver='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
            [[ "$GITHUB_REF_NAME" == v* && "$version" =~ $semver ]] || { echo "::error::$GITHUB_REF_NAME is not vX.Y.Z or vX.Y.Z-suffix"; exit 1; }
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main: a release is tagged on main"; exit 1; }
            release=true
          elif [[ -n "$INPUT_VERSION" ]]; then
            version="${INPUT_VERSION#v}"
            [[ "$version" =~ $semver ]] || { echo "::error::'$INPUT_VERSION' is not X.Y.Z or X.Y.Z-suffix"; exit 1; }
            [[ "$GITHUB_REF" == refs/heads/main ]] || { echo "::error::a release is made from main, not from $GITHUB_REF"; exit 1; }
            ! git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null 2>&1 || { echo "::error::v$version exists already"; exit 1; }
            release=true
          else
            version="0.0.0-dryrun.${GITHUB_RUN_NUMBER}"
            release=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Install Playwright and Chromium
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Test the site
        run: |
          node tests/e2e/site.mjs
          E2E_ROOT=site node tests/e2e/demos.mjs

      - name: Zip the site (with the runtime sources, README and LICENSE)
        run: |
          name="fsharp-wasm-runtime-site-${{ steps.version.outputs.version }}"
          mkdir -p "out/$name"
          cp -r site/. "out/$name/"
          cp -r runtime "out/$name/runtime-src"
          cp LICENSE README.md "out/$name/"
          (cd out && zip -qr "../$name.zip" "$name" -x '*.DS_Store')
          sha256sum "$name.zip" > "$name.zip.sha256"

      # The tarball that is uploaded here is the one that is published: the package ships the runtime/ glue next to index.js.
      - name: Pack the npm package
        run: |
          cp -r runtime tools/npm-package/runtime
          cp LICENSE NOTICE tools/npm-package/
          cd tools/npm-package
          npm version --no-git-tag-version --allow-same-version "${{ steps.version.outputs.version }}"
          npm pack --pack-destination ../..

      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: |
            fsharp-wasm-runtime-*.tgz
            fsharp-wasm-runtime-site-*.zip
            fsharp-wasm-runtime-site-*.zip.sha256

      # A release that publishes nothing is a failed release: without the token a tag run stops here, red, before anything is published.
      - name: The token for npm is there
        if: steps.version.outputs.release == 'true' && env.NODE_AUTH_TOKEN == ''
        run: |
          echo "::error::the secret NPM_TOKEN is not visible to this repository: an organisation secret has to be given access to fsharp-wasm-runtime"
          exit 1

      # A prerelease must not become `latest`; the first version of a package is also `latest`, because `npm install` of a name without that tag finds nothing.
      - name: Publish to npm
        if: steps.version.outputs.release == 'true'
        run: |
          v="${{ steps.version.outputs.version }}"
          tag=latest; [[ "$v" == *-* ]] && tag=next
          npm publish ./fsharp-wasm-runtime-*.tgz --access public --tag "$tag"
          if [[ "$tag" == next ]] && [[ -z "$(npm view @fsharp-wasm/runtime dist-tags.latest 2>/dev/null)" ]]; then
            npm dist-tag add "@fsharp-wasm/runtime@$v" latest
          fi

      - name: GitHub release (and its tag, when it is not there yet)
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}   # v0.2.0-experimental, v1.0.0-rc.1 …
          files: |
            fsharp-wasm-runtime-*.tgz
            fsharp-wasm-runtime-site-*.zip
            fsharp-wasm-runtime-site-*.zip.sha256
