name: Release

# Push a tag `vX.Y.Z` (or `vX.Y.Z-experimental`) to publish a GitHub Release.
# The committed site/ holds the prebuilt demos (.wasm) and runtime glue, so no compiler is needed here.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags for the generated notes

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Package prebuilt runtime and demos
        run: |
          set -euo pipefail
          name="fsharp-wasm-runtime-${GITHUB_REF_NAME}"
          mkdir -p out
          cp -r site "out/${name}"
          cp -r runtime "out/${name}/runtime-src"
          cp LICENSE README.md "out/${name}/"
          (cd out && zip -qr "${name}.zip" "${name}" && sha256sum "${name}.zip" > "${name}.zip.sha256")

      - name: Create GitHub Release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=(--verify-tag --generate-notes --title "${GITHUB_REF_NAME}")
          # any tag with a hyphen (v0.2.0-experimental, -rc.1) is a prerelease
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" out/*.zip out/*.sha256

      - name: Publish npm package
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        run: |
          cd tools/npm-package
          npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
