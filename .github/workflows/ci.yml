name: CI

on:
  push:
  pull_request:

jobs:
  # The committed site/ is the product: the landing page plus the prebuilt demos.  This job needs no compiler:
  # it drives every demo, the live benchmark and every link of the page in a real Chromium.
  site:
    runs-on: ubuntu-24.04   # Playwright does not support chromium on ubuntu-latest (26.04) yet
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      # one locked Playwright for both the browser download and the tests (a second, newer copy wants another chromium)
      - name: Install Playwright and Chromium
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Landing page, embedded demos, benchmark, links
        run: node tests/e2e/site.mjs

      - name: The benchmark page (every kernel against its JavaScript twin)
        run: E2E_ROOT=site node tests/e2e/bench.mjs

      - name: The benchmark on Node (the same harness, from a terminal)
        run: node demos/bench/run.mjs --profile quick --wasm site/demos/bench/Bench.wasm

      - name: Each demo's behaviour
        # tests/e2e/demos.mjs serves dist/ (a build with the compiler); here it is pointed at the committed site/
        run: node tests/e2e/demos.mjs
        env:
          E2E_ROOT: site
