name: CI

on:
  push:
  pull_request:

jobs:
  # The committed site/ is the product: the landing page plus the prebuilt demos.  This job needs no compiler:
  # it drives every demo, the live benchmark and every link of the page in a real Chromium.
  site:
    runs-on: ubuntu-24.04   # Playwright does not support chromium on ubuntu-latest (26.04) yet
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      # one locked Playwright for both the browser download and the tests (a second, newer copy wants another chromium)
      - name: Install Playwright and Chromium
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Pointer events (a press on a kept element, the moves outside it, a key)
        run: node tests/e2e/events.mjs

      - name: The DOM reconciler with SVG (the namespace, a kept element, the class)
        run: node tests/e2e/dom.mjs

      - name: Messages between the page and a sandboxed iframe
        run: node tests/e2e/frames.mjs

      - name: HTTP requests (method, headers, body, an error status, no answer at all)
        run: node tests/e2e/net.mjs

      - name: Landing page, embedded demos, benchmark, links
        run: node tests/e2e/site.mjs

      - name: The benchmark page (every kernel against its JavaScript twin)
        run: E2E_ROOT=site node tests/e2e/bench.mjs

      - name: The benchmark on Node (the same harness, from a terminal)
        run: node demos/bench/run.mjs --profile quick --wasm site/demos/bench/Bench.wasm

      # WebGPU without a GPU: Chromium's software adapter (SwiftShader).  The pictures of the GPU host are compared with Canvas 2D's, pixel by pixel; speed is not measured here.
      - name: The WebGPU host against Canvas 2D (every feature, at pixel ratio 1 and 2)
        run: node tests/e2e/gpu.mjs
        env:
          E2E_GPU_REQUIRED: 1

      - name: The accounting grid drawn by both hosts (first frame, scrolled, a cell selected)
        run: node tests/e2e/gpu-grid.mjs
        env:
          E2E_GPU_REQUIRED: 1

      - name: The actor orchestra (a worker killed and one crashed mid-run, every chunk counted once)
        run: E2E_ROOT=site node tests/e2e/orchestra.mjs

      - name: WasmOS (windows, the four systems, the Android navigation, the apps)
        run: E2E_ROOT=site node tests/e2e/wasmos.mjs

      - name: Charts (ten million samples, a stream, five million points, candles; the pyramid against every sample)
        run: E2E_ROOT=site node tests/e2e/charts.mjs

      - name: Each demo's behaviour
        # tests/e2e/demos.mjs serves dist/ (a build with the compiler); here it is pointed at the committed site/
        run: node tests/e2e/demos.mjs
        env:
          E2E_ROOT: site
